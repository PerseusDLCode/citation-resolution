[project]
name = "citation-resolution"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.0",
    "rdflib>=7.0.0",
]

[project.scripts]
tei-cts-linker = "citation_resolution.tei_cts_linker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citation_resolution"]

[tool.hatch.build.targets.wheel.include]
"src/citation_resolution/data/gazetteer.json" = "citation_resolution/data/gazetteer.json"

[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "ty>=0.0.48",
]



